   name: Cargar datos iniciales en Supabase

   on:
     workflow_dispatch:

   permissions:
     contents: read

   jobs:
     cargar:
       runs-on: ubuntu-latest
       timeout-minutes: 20
       steps:
         - uses: actions/checkout@v4
         - uses: actions/setup-python@v5
           with:
             python-version: "3.12"
         - name: Subir los datos
           env:
             SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
             SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
           run: python pipeline/cargar_supabase.py web/data
